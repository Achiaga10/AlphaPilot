[project]
name = "alphapilot"
version = "0.1.0"
description = "AI-powered stock market analysis backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.52.0",
]


[project.scripts]
alphapilot = "alphapilot.main:main"


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

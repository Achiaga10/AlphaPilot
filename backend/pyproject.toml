[project]
name = "alphapilot"
version = "0.1.0"
description = "AI-powered stock market analysis backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
    "httpx>=0.28.1",
]


[project.scripts]
alphapilot = "alphapilot.main:main"
alphapilot-sync-universe-market = "alphapilot.cli.universe_market_sync:main"
alphapilot-backtest = "alphapilot.cli.backtest:main"
alphapilot-backtest-universe = "alphapilot.cli.backtest_universe:main"
alphapilot-backtest-hybrid-thresholds = "alphapilot.cli.backtest_hybrid_thresholds:main"
alphapilot-backtest-strategy-universe = "alphapilot.cli.backtest_strategy_universe:main"
alphapilot-backtest-multi-portfolio = "alphapilot.cli.backtest_multi_portfolio:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "UP046",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

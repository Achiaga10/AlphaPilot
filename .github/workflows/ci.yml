name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://alphapilot:alphapilot@localhost:5432/alphapilot
      TEST_DATABASE_URL: postgresql+asyncpg://alphapilot:alphapilot@localhost:5432/alphapilot_test

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: alphapilot
          POSTGRES_PASSWORD: alphapilot
          POSTGRES_DB: alphapilot

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U alphapilot -d alphapilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src

      - name: Create test database
        run: |
          uv run python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://alphapilot:alphapilot@localhost:5432/postgres",
              autocommit=True,
          )

          connection.execute(
              "CREATE DATABASE alphapilot_test"
          )

          connection.close()
          PY

      - name: Verify database configuration
        run: |
          uv run python - <<'PY'
          from sqlalchemy.engine import make_url
          from alphapilot.core.config import settings

          dev_database = make_url(
              settings.DATABASE_URL
          ).database

          test_database = make_url(
              settings.TEST_DATABASE_URL
          ).database

          print(f"Development database: {dev_database}")
          print(f"Test database: {test_database}")

          assert dev_database == "alphapilot"
          assert test_database == "alphapilot_test"
          assert settings.DATABASE_URL != settings.TEST_DATABASE_URL
          PY

      - name: Run development database migrations
        run: uv run alembic upgrade head

      - name: Run test database migrations
        run: DATABASE_URL="${TEST_DATABASE_URL}" uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest
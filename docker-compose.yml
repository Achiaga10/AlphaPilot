version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: alphapilot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: alphapilot
      POSTGRES_PASSWORD: alphapilot
      POSTGRES_DB: alphapilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer

    container_name: alphapilot-adminer

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
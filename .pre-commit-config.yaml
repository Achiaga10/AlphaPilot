repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: ruff check
        args: [--fix]
        types: [python]

      - id: ruff-format
        name: ruff format
        types: [python]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest
        language: system
        pass_filenames: false